<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POLAROID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:13px;letter-spacing:.04em;overflow:hidden}
.view{position:fixed;inset:0;display:flex;flex-direction:column}
.hide{display:none!important}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px 12px;flex-wrap:wrap}
button,select{background:transparent;color:#fff;border:1px solid #fff;border-radius:2px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
button.on{background:#fff;color:#000}
button:disabled{opacity:.3}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:4px}
.frame{position:relative;border:1px solid #fff;overflow:hidden;max-width:100%;max-height:100%}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.grid{position:absolute;inset:0;pointer-events:none}
.grid i{position:absolute;background:rgba(255,255,255,.22)}
.shutter{width:66px;height:66px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0}
.shutter:active{background:#fff}
.foot{display:flex;align-items:center;justify-content:space-around;padding:16px 20px calc(20px + env(safe-area-inset-bottom))}
.panel{padding:0 14px 10px;max-height:38vh;overflow:auto}
.row{display:flex;align-items:center;gap:10px;padding:5px 0}
.row label{width:72px;flex:none;opacity:.7;font-size:11px}
input[type=range]{flex:1;accent-color:#fff;background:transparent}
input[type=text]{flex:1;background:transparent;border:none;border-bottom:1px solid #fff;color:#fff;font:inherit;padding:6px 2px;outline:none}
.wrap{position:relative;max-width:100%;max-height:100%}
canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
#draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#out img{max-width:100%;max-height:100%;object-fit:contain}
.hint{text-align:center;opacity:.6;font-size:11px;padding:10px 20px;line-height:1.6}
.seg{display:flex;gap:6px}
.err{position:absolute;padding:20px;text-align:center;line-height:1.8;opacity:.75}
</style>
</head>
<body>

<!-- ===== CAMERA ===== -->
<div id="cam" class="view">
  <div class="bar">
    <button id="ratio">3:5</button>
    <button id="flip">FLIP</button>
    <button id="grid">GRID</button>
    <button id="pro">PRO</button>
  </div>
  <div class="stage">
    <div class="frame" id="frame">
      <video id="v" autoplay playsinline muted></video>
      <div class="grid hide" id="gridLines"></div>
    </div>
    <div class="err hide" id="err"></div>
  </div>
  <div class="panel hide" id="proPanel"></div>
  <div class="foot">
    <span style="width:60px"></span>
    <button id="shot" class="shutter"></button>
    <span style="width:60px"></span>
  </div>
</div>

<!-- ===== EDIT ===== -->
<div id="edit" class="view hide">
  <div class="bar">
    <button id="back">RETAKE</button>
    <button id="save">SAVE</button>
  </div>
  <div class="stage"><div class="wrap"><canvas id="pv"></canvas><canvas id="draw"></canvas></div></div>
  <div class="panel">
    <div class="row"><input type="text" id="cap" placeholder="하고 싶은 말"></div>
    <div class="row">
      <label>글씨</label>
      <div class="seg">
        <button data-font="pen" class="on">손글씨</button>
        <button data-font="type">타이핑</button>
        <button id="penMode">직접쓰기</button>
        <button id="clearPen">지우기</button>
      </div>
    </div>
    <div class="row">
      <label>기록</label>
      <div class="seg">
        <button id="tDate" class="on">날짜</button>
        <button id="tTime" class="on">시간</button>
        <button id="tW">날씨</button>
        <select id="wIcon"><option>☀</option><option>⛅</option><option>☁</option><option>☂</option><option>❄</option><option>🌙</option></select>
      </div>
    </div>
    <div class="row"><label>밝기</label><input type="range" id="fB" min="50" max="150" value="100"></div>
    <div class="row"><label>대비</label><input type="range" id="fC" min="50" max="150" value="100"></div>
    <div class="row"><label>채도</label><input type="range" id="fS" min="0" max="200" value="100"></div>
    <div class="row"><label>색온도</label><input type="range" id="fT" min="-40" max="40" value="0"></div>
  </div>
</div>

<!-- ===== OUTPUT ===== -->
<div id="out" class="view hide">
  <div class="bar"><button id="oBack">← 편집</button><button id="dl">다운로드</button></div>
  <div class="stage"><img id="outImg" alt="polaroid"></div>
  <div class="hint">사진을 길게 눌러 <b>이미지 저장</b>을 선택하면 갤러리에 저장됩니다.</div>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let portrait=true, facing='environment', stream=null, track=null, shot=null, font='pen', penMode=false, wx=null;
const PAD=60, BOT=300;
const dims=()=>portrait?{pw:960,ph:1600}:{pw:1600,ph:960};

/* ---------- camera ---------- */
async function start(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:2560},height:{ideal:2560}},audio:false});
    $('#v').srcObject=stream; track=stream.getVideoTracks()[0];
    $('#err').classList.add('hide');
    $('#v').style.transform = facing==='user'?'scaleX(-1)':'none';
    buildPro();
  }catch(e){
    $('#err').classList.remove('hide');
    $('#err').innerHTML='카메라를 열 수 없습니다.<br>주소창의 카메라 권한을 허용하거나<br>새 탭에서 열어주세요.<br><small style="opacity:.6">'+e.name+'</small>';
  }
}
function layout(){
  const {pw,ph}=dims(), f=$('#frame');
  const maxW=innerWidth-16, maxH=innerHeight*0.62;
  let w=maxW, h=w*ph/pw; if(h>maxH){h=maxH;w=h*pw/ph;}
  f.style.width=w+'px'; f.style.height=h+'px';
  $('#gridLines').innerHTML='<i style="left:33.3%;top:0;width:1px;height:100%"></i><i style="left:66.6%;top:0;width:1px;height:100%"></i><i style="top:33.3%;left:0;height:1px;width:100%"></i><i style="top:66.6%;left:0;height:1px;width:100%"></i>';
}
$('#ratio').onclick=()=>{portrait=!portrait;$('#ratio').textContent=portrait?'3:5':'5:3';layout();};
$('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';start();};
$('#grid').onclick=e=>{e.target.classList.toggle('on');$('#gridLines').classList.toggle('hide');};
$('#pro').onclick=e=>{e.target.classList.toggle('on');$('#proPanel').classList.toggle('hide');};

function buildPro(){
  const p=$('#proPanel'); p.innerHTML='';
  if(!track||!track.getCapabilities){p.innerHTML='<div class="hint">이 기기/브라우저는 수동 제어를 지원하지 않습니다.</div>';return;}
  const c=track.getCapabilities(), s=track.getSettings(); let any=false;
  const add=(key,label,scale)=>{
    if(!c[key])return; any=true;
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<label>${label}</label>`;
    const r=document.createElement('input');
    r.type='range'; r.min=c[key].min; r.max=c[key].max; r.step=c[key].step||1; r.value=s[key]??c[key].min;
    const val=document.createElement('span'); val.style.cssText='width:56px;text-align:right;font-size:11px;opacity:.7';
    val.textContent=scale?scale(r.value):r.value;
    r.oninput=async()=>{ val.textContent=scale?scale(r.value):r.value;
      try{ await track.applyConstraints({advanced:[{exposureMode:'manual'},{whiteBalanceMode:'manual'},{[key]:+r.value}]}); }
      catch(e){ try{ await track.applyConstraints({advanced:[{[key]:+r.value}]}); }catch(_){} } };
    row.append(r,val); p.append(row);
  };
  add('iso','ISO');
  add('exposureTime','셔터', v=>'1/'+Math.max(1,Math.round(10000/Math.max(1,v))));
  add('colorTemperature','화벨', v=>v+'K');
  add('exposureCompensation','노출');
  add('zoom','줌');
  if(!any) p.innerHTML='<div class="hint">이 기기/브라우저는 ISO·셔터·화이트밸런스 수동 제어를 지원하지 않습니다.<br>(안드로이드 Chrome 일부 기기에서만 가능)</div>';
}

/* ---------- capture ---------- */
$('#shot').onclick=()=>{
  if(!track)return;
  const {pw,ph}=dims(), v=$('#v');
  shot=document.createElement('canvas'); shot.width=pw; shot.height=ph;
  const g=shot.getContext('2d');
  const vw=v.videoWidth, vh=v.videoHeight, t=pw/ph;
  let sw=vw, sh=vw/t; if(sh>vh){sh=vh;sw=vh*t;}
  const sx=(vw-sw)/2, sy=(vh-sh)/2;
  if(facing==='user'){g.translate(pw,0);g.scale(-1,1);}
  g.drawImage(v,sx,sy,sw,sh,0,0,pw,ph);
  const d=$('#draw'); d.width=pw+PAD*2; d.height=ph+PAD+BOT;
  d.getContext('2d').clearRect(0,0,d.width,d.height);
  $('#cam').classList.add('hide'); $('#edit').classList.remove('hide');
  render();
};
$('#back').onclick=()=>{$('#edit').classList.add('hide');$('#cam').classList.remove('hide');};

/* ---------- polaroid render ---------- */
function meta(){
  const n=new Date(), p=x=>String(x).padStart(2,'0'), a=[];
  if($('#tDate').classList.contains('on')) a.push(`${n.getFullYear()}.${p(n.getMonth()+1)}.${p(n.getDate())}`);
  if($('#tTime').classList.contains('on')) a.push(`${p(n.getHours())}:${p(n.getMinutes())}`);
  if($('#tW').classList.contains('on')) a.push(wx ? `${wx.icon} ${wx.temp}°C` : $('#wIcon').value);
  return a.join('   ');
}
function render(){
  if(!shot)return;
  const {pw,ph}=dims(), c=$('#pv');
  c.width=pw+PAD*2; c.height=ph+PAD+BOT;
  const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  const tmp=+$('#fT').value;
  g.filter=`brightness(${$('#fB').value}%) contrast(${$('#fC').value}%) saturate(${$('#fS').value}%) sepia(${Math.max(0,tmp)}%) hue-rotate(${tmp<0?tmp*1.2:0}deg)`;
  g.drawImage(shot,PAD,PAD);
  g.filter='none';
  g.strokeStyle='rgba(0,0,0,.12)'; g.lineWidth=2; g.strokeRect(PAD,PAD,pw,ph);
  const cap=$('#cap').value.trim(), cx=c.width/2, base=PAD+ph;
  g.fillStyle='#111'; g.textAlign='center';
  if(cap){
    g.font = font==='pen' ? '400 96px "Nanum Pen Script", cursive' : '500 52px "Noto Sans KR", sans-serif';
    g.fillText(cap, cx, base + (font==='pen'?150:140), c.width-PAD*2);
  }
  const m=meta();
  if(m){ g.font='400 34px "Noto Sans KR", sans-serif'; g.fillStyle='#555'; g.fillText(m, cx, base+BOT-70); }
}
['#fB','#fC','#fS','#fT'].forEach(s=>$(s).oninput=render);
$('#cap').oninput=render;
$$('[data-font]').forEach(b=>b.onclick=()=>{$$('[data-font]').forEach(x=>x.classList.remove('on'));b.classList.add('on');font=b.dataset.font;render();});
['#tDate','#tTime'].forEach(s=>$(s).onclick=e=>{e.target.classList.toggle('on');render();});
$('#tW').onclick=e=>{e.target.classList.toggle('on');render();if(e.target.classList.contains('on')&&!wx)getWx();};

const WMO=c=>c===0?'☀':c<3?'⛅':c<45?'☁':c<50?'🌫':c<60?'🌦':c<70?'☂':c<80?'❄':c<83?'🌧':c<87?'🌨':'⛈';
function getWx(){
  if(!navigator.geolocation)return;
  $('#tW').textContent='날씨…';
  navigator.geolocation.getCurrentPosition(async p=>{
    try{
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude.toFixed(3)}&longitude=${p.coords.longitude.toFixed(3)}&current=temperature_2m,weather_code`);
      const j=await r.json();
      wx={temp:Math.round(j.current.temperature_2m),icon:WMO(j.current.weather_code)};
      $('#tW').textContent='날씨'; $('#wIcon').style.display='none'; render();
    }catch(_){ $('#tW').textContent='날씨'; }
  },_=>{ $('#tW').textContent='날씨'; },{timeout:8000,maximumAge:600000});
}
$('#wIcon').onchange=render;

/* ---------- handwriting ---------- */
const d=$('#draw'), dg=d.getContext('2d');
let drawing=false;
$('#penMode').onclick=e=>{penMode=!penMode;e.target.classList.toggle('on');d.style.pointerEvents=penMode?'auto':'none';};
$('#clearPen').onclick=()=>dg.clearRect(0,0,d.width,d.height);
d.style.pointerEvents='none';
function pt(e){const r=d.getBoundingClientRect();return[(e.clientX-r.left)*d.width/r.width,(e.clientY-r.top)*d.height/r.height];}
d.addEventListener('pointerdown',e=>{drawing=true;d.setPointerCapture(e.pointerId);dg.beginPath();dg.moveTo(...pt(e));});
d.addEventListener('pointermove',e=>{if(!drawing)return;dg.strokeStyle='#111';dg.lineWidth=7;dg.lineCap='round';dg.lineJoin='round';dg.lineTo(...pt(e));dg.stroke();});
d.addEventListener('pointerup',()=>drawing=false);

/* ---------- save ---------- */
$('#save').onclick=()=>{
  const c=$('#pv'), f=document.createElement('canvas');
  f.width=c.width; f.height=c.height;
  const g=f.getContext('2d'); g.drawImage(c,0,0); g.drawImage(d,0,0);
  const url=f.toDataURL('image/jpeg',0.95);
  $('#outImg').src=url; $('#dl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='polaroid_'+Date.now()+'.jpg';a.click();};
  $('#edit').classList.add('hide'); $('#out').classList.remove('hide');
};
$('#oBack').onclick=()=>{$('#out').classList.add('hide');$('#edit').classList.remove('hide');};

addEventListener('resize',layout);
layout(); start();
</script>
</body>
</html>

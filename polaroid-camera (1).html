<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POLAROID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:13px;letter-spacing:.04em;overflow:hidden}
.view{position:fixed;inset:0;display:flex;flex-direction:column}
.hide{display:none!important}
.bar{display:flex;gap:6px;align-items:center;justify-content:center;padding:12px 10px;flex-wrap:wrap;flex:none}
button,select{background:transparent;color:#fff;border:1px solid #fff;border-radius:2px;padding:6px 10px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
button.on{background:#fff;color:#000}
button:disabled{opacity:.25}
button.ghost{border-color:rgba(255,255,255,.35);opacity:.8}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:4px}
.frame{position:relative;border:1px solid #fff;overflow:hidden;max-width:100%;max-height:100%}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#wbOv{position:absolute;inset:0;mix-blend-mode:soft-light;pointer-events:none}
.grid{position:absolute;inset:0;pointer-events:none}
.grid i{position:absolute;background:rgba(255,255,255,.22)}
.shutter{width:66px;height:66px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0}
.shutter:active{background:#fff}
.foot{display:flex;align-items:center;justify-content:space-between;padding:12px 22px calc(16px + env(safe-area-inset-bottom));flex:none}
.count{width:74px;font-size:11px;opacity:.7;text-align:left;letter-spacing:.08em}
.count.dev{opacity:1;color:#fff}
.zside{width:74px;text-align:right;font-size:11px;opacity:.7}
.panel{padding:0 14px 8px;max-height:40vh;overflow:auto;flex:none}
.row{display:flex;align-items:center;gap:10px;padding:4px 0}
.row label{width:64px;flex:none;opacity:.7;font-size:11px}
.row .val{width:52px;text-align:right;font-size:11px;opacity:.6}
input[type=range]{flex:1;accent-color:#fff;background:transparent;min-width:0}
input[type=text]{flex:1;background:transparent;border:none;border-bottom:1px solid #fff;color:#fff;font:inherit;padding:6px 2px;outline:none;min-width:0}
.wrap{position:relative;max-width:100%;max-height:100%}
canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
#draw{position:absolute;left:0;width:100%;touch-action:none;pointer-events:none}
#draw.live{outline:1px dashed rgba(0,0,0,.35);pointer-events:auto}
#outImg{max-width:100%;max-height:100%;object-fit:contain}
.hint{text-align:center;opacity:.6;font-size:11px;padding:8px 20px;line-height:1.6;flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.err{position:absolute;padding:20px;text-align:center;line-height:1.8;opacity:.75}
.tabs{display:flex;gap:6px;justify-content:center;padding:6px 10px 2px;flex:none}
.tabs button{border:none;border-bottom:1px solid rgba(255,255,255,.25);border-radius:0;padding:5px 12px;opacity:.5}
.tabs button.on{background:transparent;color:#fff;border-bottom-color:#fff;opacity:1}
.fx{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px}
.fx button{flex:none}
.alb{flex:1;overflow:auto;padding:4px 10px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.alb figure{position:relative;background:#111;border:1px solid rgba(255,255,255,.25);aspect-ratio:3/4;overflow:hidden}
.alb img{width:100%;height:100%;object-fit:cover;display:block}
.alb figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);font-size:9px;padding:3px 4px;text-align:center}
.empty{grid-column:1/-1;text-align:center;opacity:.5;padding:60px 20px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#000;padding:9px 16px;font-size:12px;border-radius:2px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
</style>
</head>
<body>

<!-- ===== CAMERA ===== -->
<div id="cam" class="view">
  <div class="bar">
    <button id="ratio">3:5</button>
    <button id="flip">FLIP</button>
    <button id="grid">GRID</button>
    <button id="pro">PRO</button>
    <button id="toAlbum">ALBUM</button>
  </div>
  <div class="stage">
    <div class="frame" id="frame">
      <video id="v" autoplay playsinline muted></video>
      <div id="wbOv"></div>
      <div class="grid hide" id="gridLines"></div>
    </div>
    <div class="err hide" id="err"></div>
  </div>
  <div class="panel hide" id="proPanel"></div>
  <div class="foot">
    <span class="count" id="count">10 / 10</span>
    <button id="shot" class="shutter"></button>
    <span class="zside" id="zLabel">×1.0</span>
  </div>
</div>

<!-- ===== EDIT ===== -->
<div id="edit" class="view hide">
  <div class="bar">
    <button id="back">RETAKE</button>
    <button id="save">SAVE</button>
  </div>
  <div class="stage"><div class="wrap" id="wrap"><canvas id="pv"></canvas><canvas id="draw"></canvas></div></div>
  <div class="tabs">
    <button data-tab="f" class="on">필터</button>
    <button data-tab="a">보정</button>
    <button data-tab="t">글씨</button>
  </div>
  <div class="panel" id="pF">
    <div class="fx" id="fxList"></div>
    <div class="row"><label>강도</label><input type="range" id="fxAmt" min="0" max="100" value="100"><span class="val" id="fxAmtV">100</span></div>
    <div class="row"><label>그레인</label><input type="range" id="fG" min="0" max="100" value="0"><span class="val" id="fGV">0</span></div>
    <div class="row"><label>비네팅</label><input type="range" id="fV" min="0" max="100" value="0"><span class="val" id="fVV">0</span></div>
  </div>
  <div class="panel hide" id="pA">
    <div class="row"><label>밝기</label><input type="range" id="fB" min="50" max="150" value="100"><span class="val" id="fBV">0</span></div>
    <div class="row"><label>대비</label><input type="range" id="fC" min="50" max="150" value="100"><span class="val" id="fCV">0</span></div>
    <div class="row"><label>채도</label><input type="range" id="fS" min="0" max="200" value="100"><span class="val" id="fSV">0</span></div>
    <div class="row"><label>색온도</label><input type="range" id="fT" min="-50" max="50" value="0"><span class="val" id="fTV">0</span></div>
    <div class="row"><label>틴트</label><input type="range" id="fTi" min="-50" max="50" value="0"><span class="val" id="fTiV">0</span></div>
    <div class="row"><label>확대</label><input type="range" id="fZ" min="100" max="300" value="100"><span class="val" id="fZV">×1.0</span></div>
    <div class="row"><label></label><div class="seg"><button id="resetAdj" class="ghost">보정 초기화</button><span style="font-size:10px;opacity:.5;align-self:center">사진을 드래그하면 위치 이동</span></div></div>
  </div>
  <div class="panel hide" id="pT">
    <div class="row"><input type="text" id="cap" placeholder="하고 싶은 말"></div>
    <div class="row">
      <label>글씨</label>
      <div class="seg">
        <button data-font="pen" class="on">손글씨</button>
        <button data-font="type">타이핑</button>
        <button id="penMode">직접쓰기</button>
        <button id="undoPen" class="ghost">되돌리기</button>
        <button id="clearPen" class="ghost">지우기</button>
      </div>
    </div>
    <div class="row"><label>펜 굵기</label><input type="range" id="penW" min="3" max="20" value="7"><span class="val" id="penWV">7</span></div>
    <div class="row">
      <label>기록</label>
      <div class="seg">
        <button id="tDate" class="on">날짜</button>
        <button id="tTime" class="on">시간</button>
        <button id="tW">날씨</button>
        <select id="wIcon"><option>☀</option><option>⛅</option><option>☁</option><option>☂</option><option>❄</option><option>🌙</option></select>
      </div>
    </div>
  </div>
</div>

<!-- ===== OUTPUT ===== -->
<div id="out" class="view hide">
  <div class="bar">
    <button id="oBack">← 편집</button>
    <button id="dl">다운로드</button>
    <button id="share">공유</button>
    <button id="oAlbum" class="ghost">앨범</button>
  </div>
  <div class="stage"><img id="outImg" alt="polaroid"></div>
  <div class="hint">사진을 길게 눌러 <b>이미지 저장</b>을 선택하면 갤러리에 저장됩니다.<br>저장한 사진은 앨범에도 함께 보관됩니다.</div>
</div>

<!-- ===== ALBUM ===== -->
<div id="album" class="view hide">
  <div class="bar">
    <button id="aBack">← 카메라</button>
    <span id="aCount" style="font-size:11px;opacity:.6"></span>
  </div>
  <div class="alb" id="albGrid"></div>
</div>

<!-- ===== VIEWER ===== -->
<div id="viewer" class="view hide">
  <div class="bar">
    <button id="vBack">← 앨범</button>
    <button id="vDl">다운로드</button>
    <button id="vShare">공유</button>
    <button id="vDel" class="ghost">삭제</button>
  </div>
  <div class="stage"><img id="vImg" alt="polaroid"></div>
  <div class="hint" id="vInfo"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ============ state ============ */
let portrait=true, facing='environment', stream=null, track=null, shot=null;
let font='pen', penMode=false, wx=null, camZoom=1, nativeZoom=false;
let sw={ev:0, iso:100, shut:60, wbK:5500, tint:0};   // software fallback
let nativeCaps=null;
let fx='ORIGINAL', panX=.5, panY=.5;
let strokes=[], cur=null;
const PAD=60, BOT=300, LIMIT=10;
const dims=()=>portrait?{pw:960,ph:1600}:{pw:1600,ph:960};
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);};

/* ============ daily limit + dev mode ============ */
const today=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');};
const isDev=()=>localStorage.getItem('pola_dev')==='1';
const used=()=>+(localStorage.getItem('pola_used_'+today())||0);
function setUsed(n){localStorage.setItem('pola_used_'+today(),Math.max(0,n));updateCount();}
function updateCount(){
  const c=$('#count');
  if(isDev()){c.textContent='DEV ∞';c.classList.add('dev');$('#shot').disabled=false;return;}
  c.classList.remove('dev');
  const left=LIMIT-used();
  c.textContent=left+' / '+LIMIT;
  $('#shot').disabled=left<=0;
}
// 개발자 모드: 좌측 하단 카운터를 5번 연속 탭
let tapN=0,tapT=0;
$('#count').onclick=()=>{
  const n=Date.now(); tapN=(n-tapT<600)?tapN+1:1; tapT=n;
  if(tapN>=5){tapN=0;const d=!isDev();localStorage.setItem('pola_dev',d?'1':'0');updateCount();toast(d?'개발자 모드 ON (무제한)':'개발자 모드 OFF');}
};

/* ============ camera ============ */
async function start(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:2560},height:{ideal:2560}},audio:false});
    $('#v').srcObject=stream; track=stream.getVideoTracks()[0];
    $('#err').classList.add('hide');
    nativeCaps=(track.getCapabilities?track.getCapabilities():null)||{};
    nativeZoom=!!nativeCaps.zoom;
    camZoom=1; applyCamZoom();
    buildPro(); applyPreviewFx();
  }catch(e){
    $('#err').classList.remove('hide');
    $('#err').innerHTML='카메라를 열 수 없습니다.<br>주소창의 카메라 권한을 허용하거나<br>새 탭에서 열어주세요.<br><small style="opacity:.6">'+e.name+'</small>';
  }
}
function layout(){
  const {pw,ph}=dims(), f=$('#frame');
  const maxW=innerWidth-16, maxH=innerHeight*0.55;
  let w=maxW, h=w*ph/pw; if(h>maxH){h=maxH;w=h*pw/ph;}
  f.style.width=w+'px'; f.style.height=h+'px';
  $('#gridLines').innerHTML='<i style="left:33.3%;top:0;width:1px;height:100%"></i><i style="left:66.6%;top:0;width:1px;height:100%"></i><i style="top:33.3%;left:0;height:1px;width:100%"></i><i style="top:66.6%;left:0;height:1px;width:100%"></i>';
}
$('#ratio').onclick=()=>{portrait=!portrait;$('#ratio').textContent=portrait?'3:5':'5:3';layout();};
$('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';start();};
$('#grid').onclick=e=>{e.target.classList.toggle('on');$('#gridLines').classList.toggle('hide');};
$('#pro').onclick=e=>{e.target.classList.toggle('on');$('#proPanel').classList.toggle('hide');};
$('#toAlbum').onclick=()=>openAlbum('#cam');

/* --- 노출/화벨 시뮬레이션 계산 --- */
// ISO와 셔터스피드를 노출 배율(gain)로 환산. 기준 ISO100 / 1/60초.
function swGain(){
  const g=(sw.iso/100)*((1/sw.shut)/(1/60))*Math.pow(2,sw.ev);
  return clamp(g,0.15,6);
}
function wbColor(K){ // soft-light 오버레이용 색 (낮은 K=따뜻, 높은 K=차갑)
  const d=clamp((K-5500)/3500,-1,1); // -1 warm .. 1 cool
  const a=Math.abs(d)*0.55;
  const warm=[255,150,60], cool=[70,150,255];
  const c=d<0?warm:cool;
  return `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;
}
function tintColor(t){
  const a=Math.abs(t)/50*0.5;
  return t>0?`rgba(255,0,200,${a.toFixed(3)})`:`rgba(0,255,120,${a.toFixed(3)})`;
}
function swFilterStr(){
  const g=swGain();
  const b=clamp(100*Math.pow(g,0.62),30,220);          // 밝기
  const s=clamp(100+(1-Math.min(sw.iso,3200)/3200)*0,0,200);
  const c=clamp(100-(sw.iso>800?(sw.iso-800)/3200*18:0),70,120); // 고감도는 대비 저하
  return `brightness(${b.toFixed(0)}%) contrast(${c.toFixed(0)}%) saturate(${s.toFixed(0)}%)`;
}
function applyPreviewFx(){
  const v=$('#v');
  const t=(facing==='user'?'scaleX(-1) ':'')+(nativeZoom?'':'scale('+camZoom+')');
  v.style.transform=t; v.style.transformOrigin='center';
  v.style.filter = nativeCaps&&nativeCaps.iso ? 'none' : swFilterStr();
  const ov=$('#wbOv');
  if(nativeCaps&&nativeCaps.colorTemperature){ ov.style.background=tintColor(sw.tint); }
  else{ ov.style.background=wbColor(sw.wbK); ov.style.boxShadow='none'; ov.style.backgroundImage='none'; }
  ov.dataset.tint=sw.tint;
}
function applyCamZoom(){
  $('#zLabel').textContent='×'+camZoom.toFixed(1);
  if(nativeZoom){
    const c=nativeCaps.zoom, z=clamp(camZoom*(c.min||1),c.min,c.max);
    track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
  }
  applyPreviewFx();
}
// 핀치 줌
let pinch=null;
$('#frame').addEventListener('touchstart',e=>{if(e.touches.length===2){pinch={d:tdist(e),z:camZoom};}},{passive:true});
$('#frame').addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length===2){const r=tdist(e)/pinch.d;camZoom=clamp(pinch.z*r,1,nativeZoom?(nativeCaps.zoom.max/(nativeCaps.zoom.min||1)):4);applyCamZoom();}
},{passive:true});
$('#frame').addEventListener('touchend',()=>{pinch=null;},{passive:true});
function tdist(e){const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}

/* --- PRO 패널 : 네이티브 제어 + 소프트웨어 폴백 --- */
function buildPro(){
  const p=$('#proPanel'); p.innerHTML='';
  const c=nativeCaps||{}, s=(track&&track.getSettings)?track.getSettings():{};
  const mkRow=(label,input,valEl)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<label>${label}</label>`;r.append(input,valEl);p.append(r);return r;};
  const mkRange=(min,max,step,val)=>{const r=document.createElement('input');r.type='range';r.min=min;r.max=max;r.step=step;r.value=val;return r;};
  const mkVal=t=>{const v=document.createElement('span');v.className='val';v.textContent=t;return v;};
  let native=[];

  const addNative=(key,label,fmt,modes)=>{
    if(!c[key])return; native.push(key);
    const r=mkRange(c[key].min,c[key].max,c[key].step||1,s[key]??c[key].min), val=mkVal(fmt?fmt(r.value):r.value);
    r.oninput=async()=>{
      val.textContent=fmt?fmt(r.value):r.value;
      try{ await track.applyConstraints({advanced:[...(modes||[]),{[key]:+r.value}]}); }
      catch(_){ try{ await track.applyConstraints({advanced:[{[key]:+r.value}]}); }catch(__){} }
    };
    mkRow(label,r,val);
  };
  addNative('iso','ISO',v=>v,[{exposureMode:'manual'}]);
  addNative('exposureTime','셔터',v=>'1/'+Math.max(1,Math.round(10000/Math.max(1,v))),[{exposureMode:'manual'}]);
  addNative('colorTemperature','화벨',v=>v+'K',[{whiteBalanceMode:'manual'}]);
  addNative('exposureCompensation','노출',v=>(+v).toFixed(1)+'EV');
  if(c.zoom){
    const r=mkRange(c.zoom.min,c.zoom.max,c.zoom.step||.1,s.zoom??c.zoom.min), val=mkVal('×'+(+r.value).toFixed(1));
    r.oninput=()=>{camZoom=+r.value/(c.zoom.min||1);val.textContent='×'+camZoom.toFixed(1);applyCamZoom();};
    mkRow('줌',r,val); native.push('zoom');
  }

  // 소프트웨어 폴백 (기기가 지원하지 않는 항목만)
  const sim=[];
  if(!c.iso) sim.push(()=>{
    const r=mkRange(50,3200,50,sw.iso), val=mkVal('ISO '+sw.iso);
    r.oninput=()=>{sw.iso=+r.value;val.textContent='ISO '+sw.iso;applyPreviewFx();};
    mkRow('ISO',r,val);
  });
  if(!c.exposureTime) sim.push(()=>{
    const steps=[4,8,15,30,60,125,250,500,1000,2000];
    const r=mkRange(0,steps.length-1,1,steps.indexOf(60)), val=mkVal('1/'+sw.shut);
    r.oninput=()=>{sw.shut=steps[+r.value];val.textContent='1/'+sw.shut;applyPreviewFx();};
    mkRow('셔터',r,val);
  });
  if(!c.colorTemperature) sim.push(()=>{
    const r=mkRange(2500,9000,100,sw.wbK), val=mkVal(sw.wbK+'K');
    r.oninput=()=>{sw.wbK=+r.value;val.textContent=sw.wbK+'K';applyPreviewFx();};
    mkRow('화벨',r,val);
  });
  if(!c.exposureCompensation) sim.push(()=>{
    const r=mkRange(-2,2,.1,sw.ev), val=mkVal(sw.ev.toFixed(1)+'EV');
    r.oninput=()=>{sw.ev=+r.value;val.textContent=sw.ev.toFixed(1)+'EV';applyPreviewFx();};
    mkRow('노출',r,val);
  });
  if(!c.zoom) sim.push(()=>{
    const r=mkRange(1,4,.1,camZoom), val=mkVal('×'+camZoom.toFixed(1));
    r.oninput=()=>{camZoom=+r.value;val.textContent='×'+camZoom.toFixed(1);applyCamZoom();};
    mkRow('줌',r,val);
  });
  if(sim.length){
    const h=document.createElement('div');h.className='hint';h.style.textAlign='left';h.style.padding='8px 0 2px';
    h.innerHTML= native.length? '아래 항목은 기기가 하드웨어 제어를 지원하지 않아 <b>소프트웨어로 시뮬레이션</b>됩니다.'
                              : '이 기기는 하드웨어 수동 제어를 지원하지 않아 아래 값은 <b>소프트웨어로 시뮬레이션</b>되어 촬영 결과에 반영됩니다.';
    p.append(h);
    sim.forEach(f=>f());
  }
  const reset=document.createElement('button');reset.className='ghost';reset.textContent='수동 설정 초기화';
  reset.onclick=()=>{sw={ev:0,iso:100,shut:60,wbK:5500,tint:0};camZoom=1;buildPro();applyCamZoom();};
  const rr=document.createElement('div');rr.className='row';rr.append(reset);p.append(rr);
}

/* ============ capture ============ */
$('#shot').onclick=()=>{
  if(!track)return;
  if(!isDev()&&used()>=LIMIT){toast('오늘의 10장을 모두 사용했습니다');return;}
  const {pw,ph}=dims(), v=$('#v');
  shot=document.createElement('canvas'); shot.width=pw; shot.height=ph;
  const g=shot.getContext('2d');
  const vw=v.videoWidth, vh=v.videoHeight, t=pw/ph;
  let sw2=vw, sh=vw/t; if(sh>vh){sh=vh;sw2=vh*t;}
  if(!nativeZoom&&camZoom>1){sw2/=camZoom;sh/=camZoom;}
  const sx=(vw-sw2)/2, sy=(vh-sh)/2;
  if(facing==='user'){g.translate(pw,0);g.scale(-1,1);}
  if(!(nativeCaps&&nativeCaps.iso)) g.filter=swFilterStr();
  g.drawImage(v,sx,sy,sw2,sh,0,0,pw,ph);
  g.filter='none';
  if(facing==='user'){g.setTransform(1,0,0,1,0,0);}
  // 화이트밸런스 / 틴트 굽기
  if(!(nativeCaps&&nativeCaps.colorTemperature)) paint(g,pw,ph,wbColor(sw.wbK),'soft-light');
  if(sw.tint) paint(g,pw,ph,tintColor(sw.tint),'soft-light');
  if(sw.iso>800&&!(nativeCaps&&nativeCaps.iso)) grain(g,pw,ph,clamp((sw.iso-800)/2400,0,1)*0.22);

  if(!isDev()) setUsed(used()+1);
  // 초기화
  panX=panY=.5; strokes=[]; cur=null;
  $('#fZ').value=100; $('#fZV').textContent='×1.0';
  const d=$('#draw'); const dg=d.getContext('2d'); dg.clearRect(0,0,d.width,d.height);
  $('#cam').classList.add('hide'); $('#edit').classList.remove('hide');
  render();
};
$('#back').onclick=()=>{
  if(!isDev()) setUsed(used()-1);          // 다시 찍기는 장수 복구
  $('#edit').classList.add('hide');$('#cam').classList.remove('hide');
};
function paint(g,w,h,color,mode){g.save();g.globalCompositeOperation=mode;g.fillStyle=color;g.fillRect(0,0,w,h);g.restore();}

/* ============ grain ============ */
let noiseTile=null;
function noise(){
  if(noiseTile)return noiseTile;
  const n=document.createElement('canvas');n.width=n.height=160;
  const g=n.getContext('2d'),d=g.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=180+Math.random()*150;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  g.putImageData(d,0,0);noiseTile=n;return n;
}
function grain(g,w,h,a){
  if(a<=0)return;
  g.save();g.globalAlpha=a;g.globalCompositeOperation='overlay';
  const p=g.createPattern(noise(),'repeat');g.fillStyle=p;g.fillRect(0,0,w,h);g.restore();
}
function vignette(g,w,h,a){
  if(a<=0)return;
  const r=g.createRadialGradient(w/2,h/2,Math.min(w,h)*0.28,w/2,h/2,Math.max(w,h)*0.72);
  r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,`rgba(0,0,0,${a})`);
  g.save();g.globalCompositeOperation='multiply';g.fillStyle=r;g.fillRect(0,0,w,h);g.restore();
}

/* ============ film presets ============ */
const PRESETS={
  ORIGINAL:{label:'ORIGINAL'},
  FILM   :{label:'FILM',    f:'saturate(1.12) contrast(1.06) brightness(1.03) sepia(.12)', fade:.06, grain:.12},
  CINEMA :{label:'CINEMA',  f:'contrast(1.20) saturate(.92) brightness(.98)', tealA:.30, warmHL:.12, vig:.32},
  MONO   :{label:'MONO',    f:'grayscale(1) contrast(1.20) brightness(1.03)', grain:.14, vig:.18},
  VINTAGE:{label:'VINTAGE', f:'sepia(.34) saturate(.88) contrast(.92) brightness(1.07)', fade:.10, vig:.26, grain:.08},
  COOL   :{label:'COOL',    f:'saturate(1.06) contrast(1.08) brightness(1.0)', coolA:.30}
};
function buildFx(){
  const l=$('#fxList'); l.innerHTML='';
  Object.keys(PRESETS).forEach(k=>{
    const b=document.createElement('button'); b.textContent=PRESETS[k].label;
    if(k===fx)b.classList.add('on');
    b.onclick=()=>{fx=k;[...l.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};
    l.append(b);
  });
}
buildFx();

/* ============ photo layer (zoom / pan / filters) ============ */
const off=document.createElement('canvas');
function photoLayer(pw,ph){
  off.width=pw; off.height=ph;
  const g=off.getContext('2d');
  const z=+$('#fZ').value/100;
  const sw2=shot.width/z, sh=shot.height/z;
  const sx=clamp(panX*(shot.width-sw2),0,shot.width-sw2);
  const sy=clamp(panY*(shot.height-sh),0,shot.height-sh);

  const p=PRESETS[fx]||{}, amt=+$('#fxAmt').value/100;
  const base=`brightness(${$('#fB').value}%) contrast(${$('#fC').value}%) saturate(${$('#fS').value}%)`;
  g.filter = base + (p.f&&amt>0 ? ' '+scaleFilter(p.f,amt) : '');
  g.drawImage(shot,sx,sy,sw2,sh,0,0,pw,ph);
  g.filter='none';

  const t=+$('#fT').value, ti=+$('#fTi').value;
  if(t) paint(g,pw,ph,wbColor(5500-t*70),'soft-light');
  if(ti) paint(g,pw,ph,tintColor(ti),'soft-light');

  if(p.tealA) paint(g,pw,ph,`rgba(0,90,130,${(p.tealA*amt).toFixed(3)})`,'soft-light');
  if(p.warmHL) paint(g,pw,ph,`rgba(255,160,70,${(p.warmHL*amt).toFixed(3)})`,'soft-light');
  if(p.coolA) paint(g,pw,ph,`rgba(70,150,255,${(p.coolA*amt).toFixed(3)})`,'soft-light');
  if(p.fade) paint(g,pw,ph,`rgba(255,255,255,${(p.fade*amt).toFixed(3)})`,'source-over');

  vignette(g,pw,ph,(p.vig?p.vig*amt:0)+(+$('#fV').value/100)*0.55);
  grain(g,pw,ph,(p.grain?p.grain*amt:0)+(+$('#fG').value/100)*0.25);
  return off;
}
function scaleFilter(str,a){ // 필터 강도 보간
  return str.replace(/([a-z-]+)\(([-\d.]+)(%|deg)?\)/g,(m,fn,v,u)=>{
    v=+v; const neutral=(fn==='sepia'||fn==='grayscale'||fn==='hue-rotate')?0:1;
    const nv=neutral+(v-neutral)*a;
    return `${fn}(${nv.toFixed(3)}${u||''})`;
  });
}

/* ============ polaroid render ============ */
function meta(){
  const n=new Date(), p=x=>String(x).padStart(2,'0'), a=[];
  if($('#tDate').classList.contains('on')) a.push(`${n.getFullYear()}.${p(n.getMonth()+1)}.${p(n.getDate())}`);
  if($('#tTime').classList.contains('on')) a.push(`${p(n.getHours())}:${p(n.getMinutes())}`);
  if($('#tW').classList.contains('on')) a.push(wx ? `${wx.icon} ${wx.temp}°C` : $('#wIcon').value);
  return a.join('   ');
}
function wrapText(g,text,maxW){
  const words=[...text]; let lines=[],line='';
  for(const ch of words){ const test=line+ch; if(g.measureText(test).width>maxW&&line){lines.push(line);line=ch;} else line=test; }
  if(line)lines.push(line);
  return lines.slice(0,2);
}
function render(){
  if(!shot)return;
  const {pw,ph}=dims(), c=$('#pv');
  c.width=pw+PAD*2; c.height=ph+PAD+BOT;
  const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(photoLayer(pw,ph),PAD,PAD);
  g.strokeStyle='rgba(0,0,0,.12)'; g.lineWidth=2; g.strokeRect(PAD,PAD,pw,ph);

  const cap=$('#cap').value.trim(), cx=c.width/2, base=PAD+ph;
  g.fillStyle='#111'; g.textAlign='center';
  if(cap){
    g.font = font==='pen' ? '400 96px "Nanum Pen Script", cursive' : '500 52px "Noto Sans KR", sans-serif';
    const lines=wrapText(g,cap,c.width-PAD*2), lh=font==='pen'?92:64;
    lines.forEach((l,i)=>g.fillText(l,cx,base+(font==='pen'?140:130)+i*lh));
  }
  const m=meta();
  if(m){ g.font='400 34px "Noto Sans KR", sans-serif'; g.fillStyle='#555'; g.fillText(m, cx, base+BOT-70); }
  syncDraw();
}
function syncDraw(){
  const c=$('#pv'), d=$('#draw'), {ph}=dims();
  if(d.width!==c.width||d.height!==BOT){ d.width=c.width; d.height=BOT; repaintPen(); }
  d.style.top=((PAD+ph)/c.height*100)+'%';
  d.style.height=(BOT/c.height*100)+'%';
}
['#fB','#fC','#fS','#fT','#fTi','#fZ','#fG','#fV','#fxAmt'].forEach(s=>$(s).oninput=()=>{updVals();render();});
function updVals(){
  $('#fBV').textContent=(+$('#fB').value-100);
  $('#fCV').textContent=(+$('#fC').value-100);
  $('#fSV').textContent=(+$('#fS').value-100);
  $('#fTV').textContent=$('#fT').value;
  $('#fTiV').textContent=$('#fTi').value;
  $('#fZV').textContent='×'+(+$('#fZ').value/100).toFixed(1);
  $('#fGV').textContent=$('#fG').value;
  $('#fVV').textContent=$('#fV').value;
  $('#fxAmtV').textContent=$('#fxAmt').value;
}
$('#resetAdj').onclick=()=>{
  ['#fB','#fC','#fS'].forEach(s=>$(s).value=100);
  ['#fT','#fTi','#fG','#fV'].forEach(s=>$(s).value=0);
  $('#fZ').value=100; $('#fxAmt').value=100; panX=panY=.5; updVals(); render();
};
$('#cap').oninput=render;
$$('[data-font]').forEach(b=>b.onclick=()=>{$$('[data-font]').forEach(x=>x.classList.remove('on'));b.classList.add('on');font=b.dataset.font;render();});
['#tDate','#tTime'].forEach(s=>$(s).onclick=e=>{e.target.classList.toggle('on');render();});
$('#tW').onclick=e=>{e.target.classList.toggle('on');render();if(e.target.classList.contains('on')&&!wx)getWx();};
$('#wIcon').onchange=render;
$$('.tabs button').forEach(b=>b.onclick=()=>{
  $$('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  ['f','a','t'].forEach(k=>$('#p'+k.toUpperCase()).classList.toggle('hide',k!==b.dataset.tab));
});

/* ============ 사진 드래그(팬) ============ */
let pan=null;
$('#pv').addEventListener('pointerdown',e=>{
  if(+$('#fZ').value<=100)return;
  pan={x:e.clientX,y:e.clientY,px:panX,py:panY,w:$('#pv').clientWidth,h:$('#pv').clientHeight};
  $('#pv').setPointerCapture(e.pointerId);
});
$('#pv').addEventListener('pointermove',e=>{
  if(!pan)return;
  const z=+$('#fZ').value/100;
  panX=clamp(pan.px-(e.clientX-pan.x)/pan.w/z*1.6,0,1);
  panY=clamp(pan.py-(e.clientY-pan.y)/pan.h/z*1.6,0,1);
  render();
});
addEventListener('pointerup',()=>{pan=null;});

/* ============ 날씨 ============ */
const WMO=c=>c===0?'☀':c<3?'⛅':c<45?'☁':c<50?'🌫':c<60?'🌦':c<70?'☂':c<80?'❄':c<83?'🌧':c<87?'🌨':'⛈';
function getWx(){
  if(!navigator.geolocation)return;
  $('#tW').textContent='날씨…';
  navigator.geolocation.getCurrentPosition(async p=>{
    try{
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude.toFixed(3)}&longitude=${p.coords.longitude.toFixed(3)}&current=temperature_2m,weather_code`);
      const j=await r.json();
      wx={temp:Math.round(j.current.temperature_2m),icon:WMO(j.current.weather_code)};
      $('#tW').textContent='날씨'; $('#wIcon').style.display='none'; render();
    }catch(_){ $('#tW').textContent='날씨'; }
  },_=>{ $('#tW').textContent='날씨'; },{timeout:8000,maximumAge:600000});
}

/* ============ 손글씨 (폴라로이드 하단 프레임 안에서만) ============ */
const d=$('#draw'), dg=d.getContext('2d');
$('#penMode').onclick=e=>{penMode=!penMode;e.target.classList.toggle('on');d.classList.toggle('live',penMode);};
$('#clearPen').onclick=()=>{strokes=[];repaintPen();};
$('#undoPen').onclick=()=>{strokes.pop();repaintPen();};
$('#penW').oninput=e=>$('#penWV').textContent=e.target.value;
function pt(e){const r=d.getBoundingClientRect();return[(e.clientX-r.left)*d.width/r.width,(e.clientY-r.top)*d.height/r.height];}
function repaintPen(){
  dg.clearRect(0,0,d.width,d.height);
  dg.strokeStyle='#111';dg.lineCap='round';dg.lineJoin='round';
  strokes.forEach(s=>{dg.lineWidth=s.w;dg.beginPath();s.p.forEach((q,i)=>i?dg.lineTo(q[0],q[1]):dg.moveTo(q[0],q[1]));dg.stroke();});
}
d.addEventListener('pointerdown',e=>{
  if(!penMode)return;
  e.preventDefault();
  cur={w:+$('#penW').value,p:[pt(e)]};strokes.push(cur);d.setPointerCapture(e.pointerId);
});
d.addEventListener('pointermove',e=>{if(!cur)return;cur.p.push(pt(e));repaintPen();});
addEventListener('pointerup',()=>{cur=null;});

/* ============ 앨범 (IndexedDB) ============ */
let dbp=null;
function db(){
  return dbp||(dbp=new Promise((res,rej)=>{
    const r=indexedDB.open('polaroid',1);
    r.onupgradeneeded=()=>{const s=r.result.createObjectStore('photos',{keyPath:'id'});s.createIndex('ts','ts');};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }));
}
async function dbPut(o){const x=await db();return new Promise((res,rej)=>{const t=x.transaction('photos','readwrite');t.objectStore('photos').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function dbAll(){const x=await db();return new Promise((res,rej)=>{const t=x.transaction('photos'),q=t.objectStore('photos').getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.ts-a.ts));q.onerror=()=>rej(q.error);});}
async function dbDel(id){const x=await db();return new Promise(res=>{const t=x.transaction('photos','readwrite');t.objectStore('photos').delete(id);t.oncomplete=res;});}

let albumFrom='#cam', curPhoto=null;
async function openAlbum(from){
  albumFrom=from||'#cam';
  $$('.view').forEach(v=>v.classList.add('hide'));
  $('#album').classList.remove('hide');
  const g=$('#albGrid'); g.innerHTML='<div class="empty">불러오는 중…</div>';
  let list=[];
  try{ list=await dbAll(); }catch(_){ g.innerHTML='<div class="empty">앨범을 열 수 없습니다.</div>'; return; }
  $('#aCount').textContent=list.length?list.length+'장':'';
  if(!list.length){g.innerHTML='<div class="empty">아직 저장한 사진이 없습니다.<br>촬영 후 SAVE를 누르면 여기에 보관됩니다.</div>';return;}
  g.innerHTML='';
  list.forEach(p=>{
    const f=document.createElement('figure');
    const i=document.createElement('img'); i.src=p.data; i.loading='lazy';
    const c=document.createElement('figcaption'); c.textContent=new Date(p.ts).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'});
    f.append(i,c); f.onclick=()=>openViewer(p); g.append(f);
  });
}
$('#aBack').onclick=()=>{$$('.view').forEach(v=>v.classList.add('hide'));$(albumFrom).classList.remove('hide');};
function openViewer(p){
  curPhoto=p;
  $$('.view').forEach(v=>v.classList.add('hide'));
  $('#viewer').classList.remove('hide');
  $('#vImg').src=p.data;
  $('#vInfo').textContent=new Date(p.ts).toLocaleString('ko-KR');
}
$('#vBack').onclick=()=>openAlbum(albumFrom);
$('#vDl').onclick=()=>download(curPhoto.data,'polaroid_'+curPhoto.ts+'.jpg');
$('#vShare').onclick=()=>share(curPhoto.data);
$('#vDel').onclick=async()=>{ if(!confirm('이 사진을 앨범에서 삭제할까요?'))return; await dbDel(curPhoto.id); toast('삭제했습니다'); openAlbum(albumFrom); };

/* ============ save / share ============ */
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click();}
function dataToBlob(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:'image/jpeg'});}
async function share(url){
  try{
    const f=new File([dataToBlob(url)],'polaroid.jpg',{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'POLAROID'}); }
    else toast('이 브라우저는 공유를 지원하지 않습니다');
  }catch(_){}
}
let lastUrl=null;
$('#save').onclick=async()=>{
  const c=$('#pv'), f=document.createElement('canvas');
  f.width=c.width; f.height=c.height;
  const g=f.getContext('2d'); g.drawImage(c,0,0);
  const {ph}=dims(); g.drawImage($('#draw'),0,PAD+ph);
  const url=f.toDataURL('image/jpeg',0.92);
  lastUrl=url;
  $('#outImg').src=url;
  $('#edit').classList.add('hide'); $('#out').classList.remove('hide');
  try{ await dbPut({id:'p'+Date.now(),ts:Date.now(),data:url}); }catch(_){ toast('앨범 저장에 실패했습니다'); }
};
$('#dl').onclick=()=>download(lastUrl,'polaroid_'+Date.now()+'.jpg');
$('#share').onclick=()=>share(lastUrl);
$('#oAlbum').onclick=()=>openAlbum('#out');
$('#oBack').onclick=()=>{$('#out').classList.add('hide');$('#edit').classList.remove('hide');};

/* ============ init ============ */
addEventListener('resize',layout);
updVals(); updateCount(); layout(); start();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>render());
</script>
